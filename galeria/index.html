<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230e0e10'/%3E%3Cpath d='M24 18v28l22-14z' fill='%23D4FF3A'/%3E%3C/svg%3E">
<title>Galería de publicaciones</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;900&display=swap" rel="stylesheet">
<style>
  :root { --fondo:#0e0e10; --tarjeta:#18181c; --texto:#fff; --suave:#a9a9b3; --lima:#D4FF3A; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--fondo); color:var(--texto); font-family:Montserrat, system-ui, sans-serif; padding:32px 16px 64px; }
  header { max-width:1240px; margin:0 auto 28px; }
  h1 { font-weight:900; font-size:clamp(28px,4vw,44px); letter-spacing:-.02em; text-transform:uppercase; }
  h1 span { background:var(--lima); color:#111; padding:0 12px 4px; border-radius:10px; display:inline-block; transform:rotate(-2deg); }
  header p { color:var(--suave); margin-top:10px; font-weight:600; }
  .rejilla { max-width:1240px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:22px; }
  .reel { background:var(--tarjeta); border-radius:18px; overflow:hidden; cursor:pointer; border:2px solid transparent; transition:transform .15s ease, border-color .15s ease; }
  .reel:hover { transform:translateY(-3px); border-color:var(--lima); }
  .reel img, .reel .sin { width:100%; aspect-ratio:9/16; object-fit:cover; display:block; background:#222; }
  .info { padding:12px 14px 16px; }
  .num { font-weight:900; color:var(--lima); font-size:13px; letter-spacing:.06em; }
  .info h2 { font-size:15px; font-weight:900; margin:4px 0 6px; line-height:1.2; text-transform:uppercase; }
  .info p { color:var(--suave); font-size:13px; font-weight:600; line-height:1.35; }
  .visor { position:fixed; inset:0; background:rgba(0,0,0,.9); display:none; align-items:center; justify-content:center; gap:28px; padding:20px; z-index:10; }
  .visor.abierto { display:flex; }
  .visor video { height:min(92vh,1100px); max-width:92vw; aspect-ratio:9/16; border-radius:16px; background:#000; }
  .visor img#foto { height:min(92vh,1100px); max-width:92vw; aspect-ratio:9/16; object-fit:contain; border-radius:16px; }
  .seccion { grid-column:1/-1; font-weight:900; text-transform:uppercase; font-size:22px; margin-top:18px; }
  .lado { width:360px; }
  .lado h3 { font-weight:900; text-transform:uppercase; font-size:20px; }
  .lado .archivo { color:var(--lima); font-size:13px; margin:6px 0 14px; font-weight:600; word-break:break-all; }
  .lado pre { white-space:pre-wrap; font-family:inherit; font-size:14px; line-height:1.45; color:#ddd; background:var(--tarjeta); padding:14px; border-radius:12px; max-height:55vh; overflow:auto; }
  .boton { background:var(--lima); color:#111; border:0; font:900 15px Montserrat, sans-serif; padding:10px 16px; border-radius:999px; cursor:pointer; text-decoration:none; display:inline-block; }
  .botones { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
  .boton.claro { background:#fff; }
  .cerrar { position:absolute; top:16px; right:20px; }
  @media (max-width:900px) {
    .visor { flex-direction:column; justify-content:flex-start; overflow-y:auto; padding:0 0 24px; gap:16px; }
    .visor img#foto { width:100vw; height:auto; border-radius:0; flex:none; }
    .visor video { width:100vw; max-width:100vw; height:100svh; border-radius:0; object-fit:contain; flex:none; }
    .lado { width:100%; padding:0 16px; }
    .cerrar { position:fixed; z-index:11; }
    .rejilla { grid-template-columns:repeat(2,1fr); gap:12px; }
  }
</style>
</head>
<body>
<header>
  <h1>Galería de <span>reels</span></h1>
  <p>Pulsa cualquiera para verlo (los vídeos, con sonido). Abajo tienes las historias y las portadas de las destacadas. A la derecha tienes su pie de foto para copiarlo y el botón para descargar el vídeo. Esc o «Cerrar» para salir.</p>
</header>
<main class="rejilla" id="rejilla"></main>
<div class="visor" id="visor">
  <button class="boton cerrar" id="cerrar">Cerrar ✕</button>
  <video id="video" controls playsinline preload="none"></video>
  <img id="foto" alt="" style="display:none">
  <div class="lado">
    <h3 id="v-titulo"></h3>
    <div class="archivo" id="v-archivo"></div>
    <pre id="v-pie"></pre>
    <div class="botones">
      <button class="boton" id="copiar">Copiar pie de foto</button>
      <a class="boton claro" id="descargar" href="#" download>Descargar vídeo</a>
    </div>
  </div>
</div>
<script>
const REELS = [{"n": "REEL 9", "v": "reel09-m.mp4", "t": "Por qué hago webs que nadie me pide", "d": "Enseña las webs ya hechas a los negocios antes de que se las pidan.", "portada": "reel09.jpg", "pie": "Hago webs que nadie me ha pedido. Y tiene truco.\n\nMuchos negocios pierden clientes solo porque su web no está a la altura (o ni la tienen).\nPor eso no les cuento lo que podría hacer: se lo enseño ya hecho, con su información, horarios, precios y productos.\nSi les gusta, lo hacemos. Si no, no pasa nada.\nLa primera semana ya tenía mi primer cliente.\n\n¿Tienes un negocio? Comenta WEB y te enseño cómo quedaría la tuya.\n\n#diseñoweb #emprendimiento #negocioslocales #pablosanchezmarketing #webparanegocios\n"}, {"n": "REEL 10", "v": "reel10-m.mp4", "t": "¿Web o Instagram?", "d": "Instagram es para quien ya te conoce; Google, para quien aún no sabe que existes.", "portada": "reel10.jpg", "pie": "«¿Para qué quiero una web si ya tengo Instagram?» Me lo dicen casi todos los días.\n\nY en parte tienen razón: Instagram está genial para los que ya te siguen.\nPero cuando alguien que no te conoce busca tu servicio en Google, no le sales tú.\nLe sale la web de tu competencia.\nInstagram es para los que ya te conocen. Google, para los que aún no saben que existes.\n\n¿Quieres saber si apareces en Google? Comenta WEB y te lo miro gratis.\n\n#diseñoweb #negocioslocales #instagramparanegocios #seolocal #pablosanchezmarketing\n"}, {"n": "REEL 11", "v": "reel11-m.mp4", "t": "Lo ven antes que tu web", "d": "Tu ficha de Google: si el horario o las fotos están mal, se dan la vuelta.", "portada": "reel11.jpg", "pie": "Tus clientes ven esto antes que tu web. Y casi nadie lo cuida.\n\nEs tu ficha de Google: lo que sale en el mapa cuando te buscan.\nSi el horario está mal, las fotos son antiguas y no contestas las reseñas, mucha gente se da la vuelta antes de llegar a tu web.\n3 cosas para hoy: horarios actualizados, 5 fotos buenas y contestar a las reseñas.\nEs gratis y son 20 minutos.\n\n¿Quieres que mire tu ficha y tu web? Comenta WEB y te lo reviso.\n\n#googlemaps #fichadegoogle #negocioslocales #seolocal #pablosanchezmarketing\n"}, {"n": "REEL 12", "v": "reel12-m.mp4", "t": "7 de 10 webs fallan", "d": "7 de cada 10 webs de fontaneros fallan en el móvil y regalan clientes a las otras 3.", "portada": "reel12.jpg", "pie": "Busqué «fontanero en Valladolid» y 7 de las 10 primeras webs fallaban.\n\nLas abrí todas en el móvil: letras diminutas, botones que no se pueden pulsar o directamente sin web.\nEl que busca un fontanero tiene una urgencia. Si no ve el botón de llamar, llama a otro.\nEsas 7 webs le están regalando clientes a las otras 3.\n\n¿No sabes en qué grupo está la tuya? Comenta WEB y te la reviso gratis.\n\n#diseñoweb #negocioslocales #valladolid #webparanegocios #pablosanchezmarketing\n"}, {"n": "REEL 13", "v": "reel13-m.mp4", "t": "3 pasos para traer clientes", "d": "Tres arreglos baratos para que la web de un fontanero deje de espantar clientes.", "portada": "reel13.jpg", "pie": "3 cambios baratos y esta web pasa de espantar clientes a traerlos.\n\n1. El teléfono estaba abajo del todo: lo subo arriba y lo pongo como botón para llamar.\n2. La foto de portada se veía fatal: va una foto real del local.\n3. «Bienvenidos a nuestra web» no dice nada: lo cambio por «Fontanero en Valladolid».\nNinguno de los tres es caro.\n\n¿Quieres saber cuál le falta a la tuya? Comenta WEB y te lo digo.\n\n#diseñoweb #negocioslocales #webparanegocios #fontaneros #pablosanchezmarketing\n"}, {"n": "REEL 14", "v": "reel14-m.mp4", "t": "Tu web no trae clientes por esto", "d": "Las 3 razones: no se ve en el móvil, tarda en cargar y no dice qué hacer.", "portada": "reel14.jpg", "pie": "Si tu web no te trae clientes, casi seguro es por una de estas 3 cosas.\n\n1. No se ve bien en el móvil, y más de la mitad de la gente entra desde ahí.\n2. Tarda en cargar: si pasan más de 3 segundos, la mitad ya se ha ido.\n3. La que más veo: no dice qué hacer. Ni botón de reservar ni de WhatsApp. La ven y se van.\n\n¿Quieres saber cuál falla en la tuya? Comenta WEB y te lo digo gratis.\n\n#diseñoweb #negocioslocales #webparanegocios #emprendimiento #pablosanchezmarketing\n"}, {"n": "REEL 15", "v": "reel15-m.mp4", "t": "¿Cuánto cuesta una web?", "d": "De 0 a 5.000 €: qué pagas en cada caso, y la oferta desde 240 € en 7 días.", "portada": "reel15.jpg", "pie": "Por una web te pueden pedir de 0 a 5.000 €. Te explico qué pagas en cada caso.\n\nLas gratis, tipo plantilla: las pagas con tu tiempo y acaban igual que las de todo el mundo.\nLas de varios miles tienen sentido si necesitas algo a medida o vendes online. Si eres un taller o un bar, no.\nYo hago webs para negocios locales desde 240 €, en 7 días, con tu dominio y perfectas en el móvil.\n\nAntes de pagar nada, comenta WEB y reviso la que tienes.\n\n#diseñoweb #preciowebs #negocioslocales #webparanegocios #pablosanchezmarketing\n"}, {"n": "REEL 16", "v": "reel16-m.mp4", "t": "Hice la web a un bar sin pedírmelo", "d": "Antes y después de la web de un bar; la parte 2, con la cara del dueño.", "portada": "reel16.jpg", "pie": "Le he hecho la web a este bar sin que me la pidiera.\n\nLa que tenía: la carta no se leía, no había teléfono y tardaba una eternidad.\nSi buscas dónde cenar y te sale eso, te vas al bar de al lado.\nLa nueva: carta clara, botones para reservar y llamar, y carga en 1 segundo.\nMañana se la enseño al dueño. Su cara, en la parte 2.\n\n¿Tu web también se ve así? Comenta WEB y reviso la tuya gratis.\n\n#diseñoweb #hosteleria #negocioslocales #antesydespues #pablosanchezmarketing\n"}, {"n": "WEB DE CLIENTE", "v": "web-rodriguez-moran-voz4.mp4", "t": "La Microbodega del Alumbro", "d": "La web de Juanjo (Rodríguez Morán): su historia y sus vinos.", "portada": "web-rodriguez-moran.jpg", "pie": "Vino de casa, con nombre y apellidos. 🍷\n\nAsí ha quedado la web de La Microbodega del Alumbro: la historia de Juanjo, sus vinos y todo pensado para verse en el móvil.\n\n¿Tu negocio también se merece una web así? 👉 Escríbeme por privado.\n\n#paginaweb #diseñoweb #bodegas #vino #negocioslocales #pablosanchezmarketing\n"}, {"n": "WEB DE CLIENTE", "v": "web-di-and-di-voz4.mp4", "t": "Peluquería Di & Di", "d": "Mada y Laura en portada, sus servicios y la cita desde el móvil.", "portada": "web-di-and-di.jpg", "pie": "Di & Di ya tiene web. ✂️\n\nMada y Laura querían una web que se pareciera a su peluquería. Así ha quedado: ellas dos en portada, sus servicios y la cita pedida en un par de toques desde el móvil.\n\n¿Tu negocio también necesita una web así? 👉 Escríbeme por privado.\n\n#paginaweb #diseñoweb #peluqueria #negocioslocales #pablosanchezmarketing\n"}, {"n": "WEB DE CLIENTE", "v": "web-puy-voz4.mp4", "t": "Peluquería Puy", "d": "Su peluquería en Villanubla, sus recogidos y la cita desde el móvil.", "portada": "web-puy.jpg", "pie": "Puy ya tiene web. 💇‍♀️\n\nSu peluquería en Villanubla, sus recogidos y la cita pedida en un par de toques desde el móvil.\n\n¿Tu negocio también necesita una web así? 👉 Escríbeme por privado.\n\n#paginaweb #diseñoweb #peluqueria #valladolid #negocioslocales #pablosanchezmarketing\n"}, {"n": "ANIMADO 1", "v": "animado1-fx.mp4", "t": "¿Por qué el bar de al lado está lleno?", "d": "Quien no sale en Google, no existe para el cliente.", "portada": "animado1.jpg", "pie": "No es la comida. Ni el precio. 🍻\nAntes de entrar, la gente busca en Google «bar cerca de mí»… y entra en el primero que aparece con web, fotos y reseñas.\nSi no sales, para ese cliente no existes.\nTe hago la web en 7 días y no pagas nada hasta verla terminada.\n👉 Escríbeme por privado.\n#paginaweb #negocioslocales #marketingdigital #hosteleria #googlemaps #valladolid #emprendedores"}, {"n": "ANIMADO 2", "v": "animado2-fx.mp4", "t": "El empleado que nunca cierra", "d": "Tu web atiende mientras duermes.", "portada": "animado2.jpg", "pie": "Mientras duermes, alguien en su sofá está buscando justo lo que haces. 🌙\nSi tienes web, ve tus fotos, horarios y precios… y te deja un mensaje.\nPor la mañana abres y ya tienes clientes esperando.\nWebs desde 240 €, listas en 7 días.\n👉 Escríbeme por privado.\n#paginaweb #pymes #negocioslocales #marketingdigital #autonomos #valladolid #emprendedores"}, {"n": "ANIMADO 3", "v": "animado3-fx.mp4", "t": "«Ya me la hace mi sobrino»", "d": "La web que nunca termina de estar.", "portada": "animado3.jpg", "pie": "Seis meses después, la web sigue «en construcción»… 🚧\nY cuando por fin está, en el móvil no se ve nada.\nTu sobrino te quiere mucho, pero no vive de esto.\nTe hago la web en 7 días y no pagas nada hasta verla terminada.\n👉 Escríbeme por privado.\n#paginaweb #negocioslocales #autonomos #pymes #marketingdigital #valladolid #emprendedores"}, {"n": "ANIMADO 4", "v": "animado4-fx.mp4", "t": "¿Cuánto te cuesta NO tener web?", "d": "Los clientes que se van a la competencia.", "portada": "animado4.jpg", "pie": "Si cada semana te buscan 10 personas y no te encuentran… se van con la competencia. 💸\nCon que solo una se quede, son 50 clientes al año.\nUna web desde 240 €. Con un solo cliente nuevo, pagada.\n👉 Escríbeme por privado.\n#paginaweb #negocioslocales #pymes #marketingdigital #autonomos #valladolid #emprendedores"}, {"n": "ANIMADO 5", "v": "animado5-fx.mp4", "t": "«Ya tengo Instagram, no necesito web»", "d": "Instagram enamora, la web te hace encontrable.", "portada": "animado5.jpg", "pie": "Instagram está genial para quien ya te sigue. 📱\nPero quien no te conoce te busca en Google… y ahí salen los que tienen web.\nY tu cuenta no es tuya: si te la cierran, lo pierdes todo.\nInstagram para enamorar. La web para que te encuentren.\n👉 Escríbeme por privado.\n#paginaweb #instagram #negocioslocales #marketingdigital #pymes #valladolid #emprendedores"}, {"n": "HISTORIA · WEBS", "v": "historia2-webs-1.jpg", "img": 1, "t": "POV: tu web carga en 1 segundo", "d": "Para la destacada «Webs».", "portada": "historia2-webs-1.jpg", "pie": "Historia para la destacada «Webs».\n\nSúbela desde la galería const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rejilla = document.getElementById("rejilla");
let previo = "";
for (const r of REELS) {
  const sec = r.img ? (r.n.startsWith("PORTADA") ? "Portadas de destacadas" : "Historias") : "Reels";
  if (sec !== previo) { const h = document.createElement("div"); h.className = "seccion"; h.textContent = sec; rejilla.appendChild(h); previo = sec; }
  const a = document.createElement("article");
  a.className = "reel";
  a.innerHTML = (r.portada ? `<img src="${r.portada}" alt="">` : `<div class="sin"></div>`) +
    `<div class="info"><div class="num">${esc(r.n)}</div><h2>${esc(r.t)}</h2><p>${esc(r.d)}</p></div>`;
  a.onclick = () => abrir(r);
  rejilla.appendChild(a);
}
const visor = document.getElementById("visor"), video = document.getElementById("video");
let actual = null;
function abrir(r) {
  actual = r;
  const foto = document.getElementById("foto");
  if (r.img) { video.style.display = "none"; foto.style.display = ""; foto.src = r.v; }
  else { foto.style.display = "none"; video.style.display = ""; video.src = r.v; if (r.portada) video.poster = r.portada; }
  document.getElementById("v-titulo").textContent = `${r.n} · ${r.t}`;
  document.getElementById("v-archivo").textContent = r.v;
  document.getElementById("v-pie").textContent = r.pie || "(sin pie de foto)";
  document.getElementById("copiar").textContent = "Copiar pie de foto";
  const d = document.getElementById("descargar"); d.href = r.v; d.setAttribute("download", r.v); d.textContent = r.img ? "Descargar imagen" : "Descargar vídeo";
  visor.classList.add("abierto"); if (!r.img) video.play().catch(() => {});
}
function cerrar() { video.pause(); video.removeAttribute("src"); video.load(); visor.classList.remove("abierto"); }
document.getElementById("cerrar").onclick = cerrar;
visor.onclick = e => { if (e.target === visor) cerrar(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") cerrar(); });
document.getElementById("copiar").onclick = async () => {
  const b = document.getElementById("copiar"), tx = actual ? actual.pie : "";
  try { await navigator.clipboard.writeText(tx); }
  catch { const t = document.createElement("textarea"); t.value = tx; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
  b.textContent = "¡Copiado!";
};
